<!DOCTYPE html>
<html>
<head>
<title>Cidade</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    h1 {
        color: #333;
    }

    .card {
        height: 200px;
        width: 10%;
        border: 1px solid #ddd;
        padding: 10px;
        margin: 10px;
        border-radius: 5px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: box-shadow 0.3s ease;
    }

    .card:hover {
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .card-title {
        color: #007BFF;
        margin-bottom: 5px;
    }

    .card-description {
        color: #555;
    }

    a {
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }
</style>
</head>

<nav>
</nav>

<body>
    <h1>Cidade</h1>
    {{cidade.nome_cidade}}
        {% for local in locais %}
            <div class="card">
                <a href="/local/{{local.nome_local}}">
                <h2 class="card-title">{{local.nome_local}}</h2>
                <p class="card-description">Descrição</p>
                </a>
            </div>
        {% endfor %}
</body>
