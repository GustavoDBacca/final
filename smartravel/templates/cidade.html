<!DOCTYPE html>
<html>
<head>
<title>Cidade</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
        }
        
        header h1 {
            margin: 0;
        }
        
        main {
            padding: 2rem;
        }
        
        main h2 {
            margin-top: 0;
        }
        
        main p {
            margin-bottom: 1rem;
        }
        
        footer {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
            margin-top: 1rem;
        }
        
        footer p {
            margin: 0;
        }
</style>
</head>
<body>
    <h1>Cidade</h1>
    {{cidade.nome_cidade}}
        {% for local in locais %}
            <div class="card">
                <a href="/local/{{local.nome_local}}">
                <h2 class="card-title">{{local.nome_local}}</h2>
                <p class="card-description">Descrição</p>
                </a>
            </div>
        {% endfor %}
</body>
